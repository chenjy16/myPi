on: [push, pull_request]

name: CI

jobs:
  CI:
    name: Node ${{ matrix.node }} and ${{ matrix.manager }}
    runs-on: ubuntu-latest
    env:
      # prisma validate/build resolve the datasource env("DATABASE_URL") and fail with
      # P1012 if it is unset. The postgres service below satisfies the DB integration
      # tests (gated on MYPI_DB_INTEGRATION); validate-only steps never contact it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node: [22, 24]
        manager: ['npm', 'yarn', 'pnpm']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        if: ${{ matrix.manager == 'pnpm' }}
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 8

      - name: Install dependencies using ${{ matrix.manager }}
        run: ${{ matrix.manager }} install

      - name: Run TypeScript type checking
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'javascript') }}
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Validate Prisma
        run: npx prisma generate && npx prisma validate

      - name: Build application
        run: npm run build

      # P1-6 test suite runs once against the ephemeral Postgres (npm + Node 22) so the
      # matrix stays lean; the DB tests self-skip everywhere else.
      - name: Apply migrations to the ephemeral Postgres
        if: ${{ matrix.manager == 'npm' && matrix.node == 22 }}
        run: npx prisma migrate deploy

      - name: Run unit + mock tests
        if: ${{ matrix.manager == 'npm' && matrix.node == 22 }}
        run: npm test

      - name: Run DB integration tests
        if: ${{ matrix.manager == 'npm' && matrix.node == 22 }}
        run: npm run test:integration
